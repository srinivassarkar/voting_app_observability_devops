# OpenTelemetry Operator Auto-Instrumentation Configuration
# Enables zero-code-change distributed tracing across Python, Node.js, and .NET services
apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: voting-app-instrumentation
  namespace: voting-app
spec:
  exporter:
    endpoint: http://otel-collector.otel.svc.cluster.local:4317
  propagators:
    - tracecontext
    - baggage
    - b3
  sampler:
    type: parentbased_always_on
  python:
    image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-python:latest
    env:
      - name: OTEL_PYTHON_LOG_CORRELATION
        value: "true"
  nodejs:
    image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-nodejs:latest
  dotnet:
    image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-dotnet:latest
